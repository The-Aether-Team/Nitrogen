plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'com.matthewprenger.cursegradle' version '[1.4,1.5)'
    id 'com.modrinth.minotaur' version '[2,3)'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}-fabric"
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    //accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

fabricApi {
    configureDataGeneration {
        modId = mod_id
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    exclude '.cache/'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.property("parchment_minecraft")}:${project.property("parchment_version")}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common:${project.jei_version}"
    //modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    modCompileOnly ("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") { exclude group: "net.fabricmc.fabric-api" }
    modCompileOnly ("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") { exclude group: "net.fabricmc.fabric-api" }
    modCompileOnly ("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}") { exclude group: "net.fabricmc.fabric-api" }

    modCompileOnly ("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { exclude group: "net.fabricmc.fabric-api" }
    modCompileOnly ("dev.architectury:architectury-fabric:${project.architectury_version}") { exclude group: "net.fabricmc.fabric-api" }

    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))
}

repositories {
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = 'https://maven.wispforest.io/releases' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = "https://maven.bawnorton.com/releases" }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_license            : mod_license,
        mod_url                : mod_url,
        mod_tracker            : mod_tracker,
        mod_credits            : mod_credits,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        fabric_version         : fabric_version,
        fabric_version_range   : fabric_version_range,
        fabric_loader_version_range : fabric_loader_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << "-Xmaxerrs" << "9000"
}

tasks.register('sourceJar', Jar) {
    dependsOn 'classes'
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
}

compileJava {
    options.incremental = false
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId project.base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/The-Aether-Team/Nitrogen"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
